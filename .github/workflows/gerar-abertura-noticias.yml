name: Abertura das Notícias

on:
  push:
    paths:
      - "noticias_de_hoje/abertura_16_outubro_2026.py"
      - ".github/workflows/gerar-abertura-noticias.yml"

permissions:
  contents: write

jobs:
  gerar-midi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar MIDI
        run: |
          python -m pip install --disable-pip-version-check music21
          python noticias_de_hoje/abertura_16_outubro_2026.py
          mv abertura_noticias_2026-10-16.mid noticias_de_hoje/
      - name: Publicar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias_de_hoje/abertura_noticias_2026-10-16.mid
          git diff --cached --quiet || git commit -m "Abertura das Notícias"
          git push
