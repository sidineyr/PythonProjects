name: Simple DjIA

on:
  push:
    branches: [master, feature/simple-djia-v1]
    paths:
      - 'SimpleDjIA/**'
      - '.github/workflows/simple-djia.yml'
  pull_request:
    branches: [master]
    paths:
      - 'SimpleDjIA/**'
      - '.github/workflows/simple-djia.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show runtime
        run: |
          python --version
          python -c "import sys; print(sys.platform); print(sys.executable)"
      - name: Compile source
        working-directory: SimpleDjIA
        run: python -m compileall -q src
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run tests without packaging
        working-directory: SimpleDjIA
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Install package
        working-directory: SimpleDjIA
        run: python -m pip install -e .
      - name: Smoke CLI
        working-directory: SimpleDjIA
        run: simple-djia --help
