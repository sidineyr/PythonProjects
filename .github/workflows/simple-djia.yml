name: Simple DjIA

on:
  push:
    branches: [master, feature/simple-djia-v1]
    paths:
      - 'SimpleDjIA/**'
      - '.github/workflows/simple-djia.yml'
  pull_request:
    branches: [master]
    paths:
      - 'SimpleDjIA/**'
      - '.github/workflows/simple-djia.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: SimpleDjIA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        run: pytest -q
      - name: Smoke CLI
        run: simple-djia --help
