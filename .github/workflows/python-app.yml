# Curated checks for the maintained root exercises. Historical experiments and
# standalone subprojects have their own validation paths.
name: Python application

on:
  push:
    branches: ["master"]
    paths:
      - "music_composer/**"
      - "tests/**"
      - "calculador.py"
      - "formatapendrivelinux.py"
      - "requirements.txt"
      - ".github/workflows/python-app.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "music_composer/**"
      - "tests/**"
      - "calculador.py"
      - "formatapendrivelinux.py"
      - "requirements.txt"
      - ".github/workflows/python-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8
      - name: Check maintained source
        run: >-
          flake8 music_composer tests calculador.py formatapendrivelinux.py
          --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run maintained tests
        run: python -m pytest -q tests
