name: SOMENTE Android

on:
  push:
    paths: ["SomenteAndroid/**", ".github/workflows/somente-android.yml"]
  pull_request:
    paths: ["SomenteAndroid/**", ".github/workflows/somente-android.yml"]

permissions:
  contents: read

concurrency:
  group: somente-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SomenteAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test, lint and assemble debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
